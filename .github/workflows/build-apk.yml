name: Build NovaIDE APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run repository static QA
        run: python3 tools/static_qa.py

      - name: Compile and test
        run: gradle --no-daemon --stacktrace clean :app:testDebugUnitTest :app:assembleDebug :app:lintDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaIDE-M10-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NovaIDE-M10-Lint-Report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
